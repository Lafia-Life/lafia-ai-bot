<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoH E-Learning Assistant</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img class="brand-mark" src="/static/logo.png" style="width: 100px; height: 100px" alt="MoH Logo" />
          <h1>MoH E-Learning Assistant</h1>
        </div>
        <div class="header-actions">
          <span class="header-badge">Chat Only</span>
        </div>
      </header>

      <section id="chat-view" class="view">
        <div class="chat-layout">
          <aside class="reference-panel">
            <div class="panel-header">
              <h2>Elearning Assistant</h2>
              <p class="panel-subtitle">Preview the passages backing each answer.</p>
            </div>
            <div id="reference-list" class="reference-list"></div>
          </aside>
          <section class="conversation-panel">
            <div id="chat-messages" class="messages"></div>
            <form id="chat-form" class="chat-form">
              <label class="sr-only" for="question">Ask a question</label>
              <div class="chat-input">
                <textarea id="question" name="question" rows="3" placeholder="Ask about your documents..." required></textarea>
                <div class="chat-actions">
                  <button type="submit">Send</button>
                </div>
              </div>
              <p id="chat-status" class="status" role="status"></p>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script src="/static/js/app.js?v=20251018" defer></script>

    <div id="reference-modal" class="reference-modal hidden" role="dialog" aria-modal="true" aria-labelledby="reference-modal-title">
      <div class="reference-modal-dialog">
        <header class="reference-modal-header">
          <h3 id="reference-modal-title" class="reference-modal-title">Document preview</h3>
          <div class="reference-modal-actions">
            <a id="reference-modal-open" class="reference-link hidden" target="_blank" rel="noopener noreferrer">Open full PDF</a>
            <button type="button" id="reference-modal-close" class="modal-close" aria-label="Close preview">×</button>
          </div>
        </header>
        <iframe id="reference-modal-frame" title="PDF preview" class="reference-modal-frame"></iframe>
      </div>
    </div>
  </body>
</html>
