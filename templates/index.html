<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lafia Chat AI</title>
    <link rel="icon" type="image/png" href="/static/brand/favicon.png" />
    <link rel="stylesheet" href="/static/css/styles.css" />

    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img class="brand-mark" src="/static/brand/lafia-logo.png" style="width: 190px; height: auto" alt="Lafia" />
          <h1>Lafia Chat AI</h1>
        </div>
        <nav class="app-nav">
          <button id="nav-upload" class="nav-button" type="button">Upload</button>
          <button id="nav-chat" class="nav-button" type="button">Chat</button>
        </nav>
      </header>

      <section id="upload-view" class="view">
        <div class="panel">
          <h2>Add Sources</h2>
          <p class="panel-description">Upload PDF reports or scrape web pages to include them in your knowledge base.</p>
          <form id="upload-form" class="upload-form">
            <input id="file-input" name="file" type="file" accept="application/pdf" required />
            <button type="submit">Upload PDF</button>
          </form>
          <div id="upload-status" class="status" role="status"></div>

          <div class="divider">
            <span>or</span>
          </div>
          <form id="scrape-form" class="scrape-form">
            <input id="url-input" name="url" type="url" placeholder="https://example.com/article" required />
            <button type="submit">Scrape URL</button>
          </form>
          <div id="scrape-status" class="status" role="status"></div>
          <!-- <div class="divider">
            <span>or</span>
          </div>
           <div class="divider">
            <span>or</span>
        </div>
        <form id="video-upload-form" class="upload-form">
            <input id="video-title" class="video-input" name="title" type="text" placeholder="Video Title" required />
            <select id="video-type" class="video-input" name="type" required>
                  <option value="youtube">YouTube</option>
                  <option value="direct">Direct Video Link</option>

            <input id="video-url" class="video-input" name="url" type="url" placeholder="Video URL (YouTube or direct link)" required />

        </div>
        <div class="panel">
          <div class="panel-header">
            <h3>Indexed Documents</h3>
            <button id="start-chat" class="secondary" type="button">Open Chat</button>
          </div>
          <ul id="document-list" class="document-list"></ul>
        </div>
      </section>

      <section id="chat-view" class="view hidden">
        <div class="chat-layout">
          <aside class="reference-panel">
            <div class="panel-header">
              <h2>Document References</h2>
              <p class="panel-subtitle">Preview the passages backing each answer.</p>
            </div>
            <div id="reference-list" class="reference-list"></div>
          </aside>
          <section class="conversation-panel">
            <div id="chat-messages" class="messages"></div>
            <form id="chat-form" class="chat-form">
              <label class="sr-only" for="question">Ask a question</label>
              <div class="chat-input">
                <textarea id="question" name="question" rows="3" placeholder="Ask about your documents..." required></textarea>
                <div class="chat-actions">
                  <button type="submit">Send</button>
                </div>
              </div>
              <p id="chat-status" class="status" role="status"></p>
            </form>
          </section>
        </div>
      </section>
    </main>
    <script src="/static/js/app.js?v=20251019" defer></script>
