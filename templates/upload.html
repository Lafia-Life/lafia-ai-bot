<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elearning Assistant</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
           <img class="brand-mark" src="/static/logo.png" style="width: 100px; height: 100px" alt="MoH Logo" />
          <h1>MoH E-Learning Assistant</h1>
        </div>
        <div class="header-actions">
          <a class="header-link" href="/chat">Open Chat</a>
        </div>
      </header>

      <section id="upload-view" class="view">
        <div class="panel">
          <h2>Add Sources</h2>
          <p class="panel-description">Upload PDF reports, OCR-ready images, or scrape web pages to include them in your knowledge base.</p>
          <form id="upload-form" class="upload-form">
            <input id="file-input" name="file" type="file" accept="application/pdf,image/*" required />
            <button type="submit">Upload File</button>
          </form>
          <div id="upload-status" class="status" role="status"></div>

          <div class="divider">
            <span>or</span>
          </div>

          <form id="scrape-form" class="scrape-form">
            <input id="url-input" name="url" type="url" placeholder="https://example.com/article" required />
            <button type="submit">Scrape URL</button>
          </form>
          <div id="scrape-status" class="status" role="status"></div>
        </div>
        <div class="divider">
            <span>or</span>
        </div>
        <form id="video-upload-form" class="upload-form" enctype="multipart/form-data">
          <div class="form-group">
              <input id="video-title" class="video-input" name="title" type="text" placeholder="Video Title" required />
          </div>
          <div class="form-group">
              <select id="video-type" class="video-input" name="type" required>
                  <option value="">Select Video Type</option>
                  <option value="youtube">YouTube</option>
                  <option value="direct">Direct Video Link</option>
                  <option value="upload">File Upload</option>
              </select>
          </div>
          <div class="form-group">
              <input id="video-url" class="video-input" name="url" type="url" placeholder="Video URL (for YouTube or direct links)" />
          </div>
           <div class="form-group">
              <input id="video-file-input" class="video-input" name="file" type="file" accept="video/*" />
          </div>
          <div class="form-group">
              <textarea id="video-description" name="description" placeholder="Video Description (optional)"></textarea>
          </div>
          <button type="submit" id="video-submit-btn">Upload Video</button>
      </form>
        <div id="upload-video-status" class="status" role="status"></div>
        <div class="panel">
          <div class="panel-header">
            <h3>Indexed Documents</h3>
          </div>
          <ul id="document-list" class="document-list"></ul>
        </div>
      </section>
    </main>

    <script src="/static/js/app.js?v=20251020" defer></script>
  </body>
</html>
