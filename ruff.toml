target-version = "py312"
line-length = 100

exclude = [
  ".venv",
  "venv",
  "storage",
  "moodle",
  "node_modules",
  "__pycache__",
]

[lint]
# Start with correctness-only linting so CI is useful without reformatting
# the legacy modules. Add stricter rules incrementally.
select = ["E9", "F63", "F7", "F82"]
