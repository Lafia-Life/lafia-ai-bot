services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local-llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3} && exec ollama serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    # 🔥 CRITICAL: ensures Python resolves paths correctly
    working_dir: /app

    # production file descriptor limits
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # persistent storage for PDFs, OCR, embeddings, Chroma DB
    volumes:
      - chatlearning_data:/app/storage

    restart: unless-stopped

    # 🔥 FIX: ensures required folders exist BEFORE app starts
    command: >
      sh -c "
      mkdir -p /app/storage/data /app/storage/uploads /app/storage/chroma
      && exec gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${WEB_CONCURRENCY:-1}
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      "

volumes:
  chatlearning_data:
  ollama_data:
