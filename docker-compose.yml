services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local-llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3} && exec ollama serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chatlearning_data:/app/storage
    restart: unless-stopped

volumes:
  chatlearning_data:
  ollama_data:
