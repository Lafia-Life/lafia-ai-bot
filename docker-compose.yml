services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local-llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3} && exec ollama serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      CHAT_MODEL: ${CHAT_MODEL:-llama3}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
    volumes:
      - chatlearning_data:/app/storage
    restart: unless-stopped

volumes:
  chatlearning_data:
  ollama_data:
